<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Perpustakaan STAH DNJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f8f9fd 0%, #e1e2e6 50%, #cde5ff 100%);
      color: #191c1f;
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 420px;
      padding: 48px 32px;
      border-radius: 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(194,199,206,0.4);
      box-shadow: 0 8px 32px rgba(10,58,90,0.08), 0 2px 8px rgba(10,58,90,0.04);
    }
    .icon-wrapper {
      width: 88px; height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #cde5ff 0%, #a3caf1 100%);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .icon-wrapper .material-symbols-outlined {
      font-size: 40px; color: #0a3a5a; font-variation-settings: 'FILL' 1;
    }
    h1 {
      font-size: 24px; font-weight: 700; line-height: 32px;
      color: #00243c; margin-bottom: 12px;
    }
    p {
      font-size: 16px; line-height: 24px; color: #42474e; margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px;
      border: none; border-radius: 14px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #0a3a5a 0%, #3a6284 100%);
      box-shadow: 0 4px 14px rgba(10,58,90,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10,58,90,0.35);
    }
    .retry-btn:active { transform: translateY(0); }
    .retry-btn .material-symbols-outlined { font-size: 20px; }
    .brand {
      margin-top: 32px; font-size: 12px; color: #72777e;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <span class="material-symbols-outlined">wifi_off</span>
    </div>
    <h1>Anda Sedang Offline</h1>
    <p>Koneksi internet tidak tersedia. Periksa jaringan Anda dan coba lagi untuk mengakses Perpustakaan STAH DNJ.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      <span class="material-symbols-outlined">refresh</span>
      Coba Lagi
    </button>
    <p class="brand">Perpustakaan STAH Dharma Nusantara Jakarta</p>
  </div>
</body>
</html>
